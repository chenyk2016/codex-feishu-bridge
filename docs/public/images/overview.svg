<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="700" viewBox="0 0 1080 700" role="img" aria-labelledby="title desc">
<title id="title">飞书到 Codex 桌面的消息往返</title><desc id="desc">已配对用户通过飞书私聊发送任务。Mac 上的桥接经长连接接收，校验身份与目标后通过 queue 加入原 Codex 聊天。Codex 本轮完成后，Stop Hook 把最终回复交给桥接，再发送飞书回复卡。入队不代表已经执行。</desc>
<defs><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#2864c7" stroke-width="1.6"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#16816c" stroke-width="1.6"/></marker></defs>
<rect width="1080" height="700" rx="28" fill="#f4f8fc"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"><text x="48" y="64" font-size="36" fill="#1c314c" font-weight="700" text-anchor="start">Codex Feishu Bridge</text><text x="48" y="105" font-size="25" fill="#526780" font-weight="400" text-anchor="start">飞书发任务，Mac 上的原聊天继续</text><rect x="36" y="150" width="300" height="410" rx="24" fill="#edf4ff" stroke="#d0e0f6" stroke-width="2"/><text x="62" y="193" font-size="21" fill="#38639c" font-weight="600" text-anchor="start">飞书平台</text><rect x="380" y="150" width="664" height="410" rx="24" fill="#edf8f4" stroke="#cee6de" stroke-width="2"/><text x="408" y="193" font-size="21" fill="#267561" font-weight="600" text-anchor="start">你的 Mac</text><rect x="66" y="246" width="240" height="178" rx="18" fill="#fff" stroke="#d6e2ee" stroke-width="2"/><text x="186" y="288" font-size="30" fill="#1c314c" font-weight="700" text-anchor="middle">飞书私聊</text><text x="186" y="335" font-size="23" fill="#1c314c" font-weight="400" text-anchor="middle">发任务 · 收回复</text><text x="186" y="378" font-size="21" fill="#60738a" font-weight="400" text-anchor="middle">已配对用户</text><rect x="420" y="246" width="252" height="178" rx="18" fill="#fff" stroke="#d6e2ee" stroke-width="2"/><text x="546" y="288" font-size="30" fill="#1c314c" font-weight="700" text-anchor="middle">本机桥接</text><text x="546" y="335" font-size="22" fill="#1c314c" font-weight="400" text-anchor="middle">校验身份与目标</text><text x="546" y="378" font-size="22" fill="#60738a" font-weight="400" text-anchor="middle">投递 · 防重复</text><rect x="752" y="246" width="252" height="178" rx="18" fill="#fff" stroke="#d6e2ee" stroke-width="2"/><text x="878" y="288" font-size="29" fill="#1c314c" font-weight="700" text-anchor="middle">Codex 桌面</text><text x="878" y="335" font-size="22" fill="#1c314c" font-weight="400" text-anchor="middle">原聊天继续执行</text><text x="878" y="378" font-size="21" fill="#60738a" font-weight="400" text-anchor="middle">保留工具权限判断</text><path d="M306 280 H414" fill="none" stroke="#2864c7" stroke-width="3" marker-end="url(#blue)"/><text x="360" y="253" font-size="18" fill="#2864c7" font-weight="400" text-anchor="middle">长连接</text><path d="M672 315 H746" fill="none" stroke="#2864c7" stroke-width="3" marker-end="url(#blue)"/><text x="711" y="287" font-size="18" fill="#2864c7" font-weight="400" text-anchor="middle">queue</text><path d="M878 428 V485 H546 V430" fill="none" stroke="#16816c" stroke-width="3" marker-end="url(#green)"/><text x="720" y="524" font-size="22" fill="#16816c" font-weight="400" text-anchor="middle">Stop Hook：本轮最终回复</text><path d="M420 390 H312" fill="none" stroke="#16816c" stroke-width="3" marker-end="url(#green)"/><text x="365" y="435" font-size="19" fill="#16816c" font-weight="400" text-anchor="middle">回复卡</text><text x="48" y="613" font-size="23" fill="#1c314c" font-weight="650" text-anchor="start">入队 ≠ 已执行</text><text x="300" y="613" font-size="23" fill="#1c314c" font-weight="650" text-anchor="start">无需开放公网入站端口</text><text x="48" y="655" font-size="22" fill="#526780" font-weight="400" text-anchor="start">Mac 需保持登录、联网和运行；回复回传需配置 Stop Hook。</text></g></svg>