<svg xmlns="http://www.w3.org/2000/svg" width="960" height="788" viewBox="0 0 960 788" role="img" aria-labelledby="title desc">
<title id="title">飞书异步问题回复流程及桌面限制</title><desc id="desc">Codex 提出异步问题，桥接发送飞书卡片。用户点选或文字回答，多题收齐后通过 queue 返回提问的原聊天。桌面原生问题框目前仍保留，用户应避免两端重复作答。同步阻塞提问和工具审批不属于此通道。</desc>
<defs><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#2864c7" stroke-width="1.6"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#16816c" stroke-width="1.6"/></marker></defs>
<rect width="960" height="788" rx="28" fill="#f4f8fc"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"><text x="48" y="62" font-size="34" fill="#1c314c" font-weight="700" text-anchor="start">在飞书回答中途问题</text><text x="48" y="104" font-size="24" fill="#526780" font-weight="400" text-anchor="start">异步提问 · 答案始终返回提问的原聊天</text><rect x="48" y="148" width="864" height="114" rx="18" fill="#fff" stroke="#d6e2ee" stroke-width="2"/><circle cx="96" cy="204" r="28" fill="#e8f0ff"/><text x="96" y="212" font-size="22" fill="#2864c7" font-weight="700" text-anchor="middle">01</text><text x="148" y="191" font-size="27" fill="#1c314c" font-weight="650" text-anchor="start">Codex 提问</text><text x="148" y="230" font-size="23" fill="#526780" font-weight="400" text-anchor="start">桥接捕获启用后的新异步问题</text><path d="M480 264 V286" fill="none" stroke="#2864c7" stroke-width="3" marker-end="url(#blue)"/><rect x="48" y="290" width="864" height="114" rx="18" fill="#fff" stroke="#d6e2ee" stroke-width="2"/><circle cx="96" cy="346" r="28" fill="#e8f0ff"/><text x="96" y="354" font-size="22" fill="#2864c7" font-weight="700" text-anchor="middle">02</text><text x="148" y="333" font-size="27" fill="#1c314c" font-weight="650" text-anchor="start">飞书作答</text><text x="148" y="372" font-size="23" fill="#526780" font-weight="400" text-anchor="start">点击选项，或按卡片格式输入文字</text><path d="M480 406 V428" fill="none" stroke="#2864c7" stroke-width="3" marker-end="url(#blue)"/><rect x="48" y="432" width="864" height="114" rx="18" fill="#fff" stroke="#d6e2ee" stroke-width="2"/><circle cx="96" cy="488" r="28" fill="#e8f0ff"/><text x="96" y="496" font-size="22" fill="#2864c7" font-weight="700" text-anchor="middle">03</text><text x="148" y="475" font-size="27" fill="#1c314c" font-weight="650" text-anchor="start">原聊天收到答案</text><text x="148" y="514" font-size="23" fill="#526780" font-weight="400" text-anchor="start">多题收齐后，通过 queue 一起送回</text><rect x="48" y="598" width="864" height="106" rx="18" fill="#fff8e8" stroke="#ead8a6" stroke-width="2"/><text x="74" y="639" font-size="27" fill="#785817" font-weight="650" text-anchor="start">桌面问题框目前仍会保留</text><text x="74" y="678" font-size="21" fill="#785817" font-weight="400" text-anchor="start">答案送回了聊天，但没有提交原生问题框；避免两端重复作答。</text><text x="48" y="752" font-size="21" fill="#526780" font-weight="400" text-anchor="start">此通道不处理同步阻塞问题，也不代替工具权限审批。</text></g></svg>